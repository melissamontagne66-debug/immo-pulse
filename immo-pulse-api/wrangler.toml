name = "immo-pulse-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Base de données D1
[[d1_databases]]
binding = "DB"
database_name = "immo-pulse-db"
# REMPLACE "TON-ID-ICI" par l'ID que tu recevras à l'étape 3
database_id = "6585b01a-aff5-4c3c-8db5-07287122b266"

# Variables d'environnement
[vars]
# REMPLACE par les URLs de ton frontend.
# Ici on autorise local + prod pour tester le cloud dans les deux environnements.
FRONTEND_URL = "http://127.0.0.1:4173,http://localhost:4173,https://immo-pulse.pages.dev"

# Secrets à configurer avec: wrangler secret put JWT_SECRET
# JWT_SECRET = "ton-secret-très-long-et-aléatoire-minimum-32-caractères"
# Variables pour l'envoi d'email via Resend :
# wrangler secret put RESEND_API_KEY
# RESEND_FROM_EMAIL = "no-reply@immo-pulse.pages.dev"
