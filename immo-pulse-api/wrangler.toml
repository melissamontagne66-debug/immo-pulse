name = "immo-pulse-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Base de données D1
[[d1_databases]]
binding = "DB"
database_name = "immo-pulse-db"
# REMPLACE "TON-ID-ICI" par l'ID que tu recevras à l'étape 3
database_id = "6585b01a-aff5-4c3c-8db5-07287122b266"

# Variables d'environnement
[vars]
# REMPLACE par les URLs de ton frontend.
# Ici on autorise local + prod pour tester le cloud dans les deux environnements.
FRONTEND_URL = "http://127.0.0.1:4173,http://localhost:4173,https://immo-pulse.pages.dev"

# Secrets à configurer avec: wrangler secret put JWT_SECRET
# JWT_SECRET = "ton-secret-très-long-et-aléatoire-minimum-32-caractères"
# Variables pour l'envoi d'email via Mailgun :
# wrangler secret put MAILGUN_API_KEY
# wrangler secret put MAILGUN_DOMAIN
# wrangler secret put MAILGUN_FROM_EMAIL
# Exemple : MAILGUN_FROM_EMAIL = "no-reply@immo-pulse.pages.dev"
# Si Mailgun n'est pas configuré, le backend utilise Resend si RESEND_API_KEY est défini.
# wrangler secret put RESEND_API_KEY
# RESEND_FROM_EMAIL = "no-reply@immo-pulse.pages.dev"
# Emails de relance (cron) — passent par Resend :
# wrangler secret put RESEND_API_KEY
# EMAIL_FROM = "Immo Pulse <coach@immo-pulse.pages.dev>"
# URL publique de ce worker, utilisée pour les liens de désinscription :
# API_URL = "https://immo-pulse-api.<ton-compte>.workers.dev"
# Notifications push FCM HTTP v1 : JSON complet du compte de service Google.
# wrangler secret put FCM_SERVICE_ACCOUNT

# Cron : 7h UTC ≈ 9h Paris (été) ; 16h UTC ≈ 18h Paris (été).
# Cloudflare ne gère pas les fuseaux horaires : en hiver (UTC+1) les déclenchements
# arrivent ~1 h plus tôt en heure de Paris (8h et 17h).
[triggers]
crons = ["0 7 * * *", "0 16 * * *"]
